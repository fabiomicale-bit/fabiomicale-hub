<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="120 120 784 800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Logo FM scudo nero oro</title>
  <desc id="desc">Logo vettoriale con iniziali FM in oro su scudo nero, per Fabio Micale.</desc>

  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8F6A18"/>
      <stop offset="28%" stop-color="#D7B45A"/>
      <stop offset="55%" stop-color="#F3DD8B"/>
      <stop offset="78%" stop-color="#B98927"/>
      <stop offset="100%" stop-color="#7A5412"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8892D"/>
      <stop offset="45%" stop-color="#F2D98A"/>
      <stop offset="100%" stop-color="#9A6E1C"/>
