        font-size="245" font-weight="700" letter-spacing="10" fill="url(#gold)">FM</text>
  <line x1="350" y1="665" x2="674" y2="665" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>
  <line x1="367" y1="692" x2="657" y2="692" stroke="#F6E7A6" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
